services:
  web:
    build: .
    image: ${STOCKPREDICT_IMAGE:-stockpredict:latest}
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      PYTHONUNBUFFERED: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
