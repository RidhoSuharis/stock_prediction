<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Prediksi Saham LQ45{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='vendor/basecoat/basecoat.cdn.min.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/theme.css') }}">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body>

    <header class="site-header">
        <div class="container site-header__inner">

            <a class="site-brand" href="{{ url_for('index') }}">
                StockPredict
            </a>

            <nav class="site-nav" aria-label="Navigasi utama">

                <a href="{{ url_for('index') }}"
                   {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>
                    Beranda
                </a>

                <a href="{{ url_for('prediction') }}"
                   {% if request.endpoint == 'prediction' %}aria-current="page"{% endif %}>
                    Prediksi
                </a>

                <a href="{{ url_for('about') }}"
                   {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>
                    Tentang
                </a>

            </nav>
        </div>
    </header>

    <main class="container site-main">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">

            <p>
                <strong>StockPredict</strong>
            </p>

            <p class="text-muted">
                Prototipe Prediksi Harga Saham LQ45
                menggunakan Deep Learning
            </p>

            <p class="text-muted">
                &copy; 2026 | Penelitian Matematika Keuangan
            </p>

        </div>
    </footer>

    <script
        src="{{ url_for('static', filename='vendor/basecoat/js/all.min.js') }}"
        defer>
    </script>

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
        defer>
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
